name: Build

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  build:

    name: Build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build
        run: |
          make

      - name: Test
        run: |
          make test
